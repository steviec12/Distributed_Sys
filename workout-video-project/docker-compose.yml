services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "0"
      UPLOAD_DIR: "/app/uploads"
    depends_on:
      - redis
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: ./worker
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_DB: "0"
      QUEUE_KEY: "queue:pending"
      UPLOAD_DIR: "/app/uploads"
    depends_on:
      - redis
    volumes:
      - ./uploads:/app/uploads

